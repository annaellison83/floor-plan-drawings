services:
  - type: web
    name: floorplan-drawings-backend
    runtime: node
    plan: starter
    branch: main
    buildCommand: npm install --prefix server
    startCommand: node server/index.js
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    disk:
      name: render-state
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: STATE_FILE
        value: /var/data/render-state.json
